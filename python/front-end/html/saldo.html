<!-- Tela que exibe o saldo do usuário -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco CTF - Conta</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="app">
    <header class="topbar">
        <button class="hamburguer" onclick="alternarMenu()">&#9776;</button>
        <div class="marca">BANCO <span>CTF</span></div>
        <div class="ola" id="ola"></div>
    </header>

    <div class="overlay-menu" id="overlayMenu" onclick="alternarMenu()"></div>
    <aside class="sidebar" id="sidebar">
        <div class="titulo-menu">MENU</div>
        <a href="saldo.html" class="ativo">Saldo</a>
        <a href="deposito.html">Depositar</a>
        <a href="saque.html">Sacar</a>
        <a href="extrato.html">Extrato</a>
        <a href="perfil.html">Meu usuario</a>
        <a href="admin.html" id="link-admin" class="oculto">Admin</a>
        <a href="#" onclick="logout(); return false;">Sair</a>
    </aside>

    <main class="conteudo">
        <div class="painel">
            <h1>Minha <span>conta</span></h1>

            <!-- Consultar saldo -->
            <div class="card">
                <h2>Ver saldo</h2>
                <input id="saldo_conta" placeholder="numero da conta">
                <button onclick="verSaldo()">Consultar</button>
                <div id="msg_saldo" class="msg"></div>
            </div>

            <!-- Transferencia -->
            <div class="card">
                <h2>Transferir</h2>
                <input id="tra_origem" placeholder="conta de origem">
                <input id="tra_destino" placeholder="conta de destino">
                <input id="tra_valor" placeholder="valor">
                <button onclick="transferir()">Transferir</button>
                <div id="msg_transferencia" class="msg"></div>
            </div>
        </div>
    </main>

    <script src="../js/app.js"></script>
</body>
</html>
