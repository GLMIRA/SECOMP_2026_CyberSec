<!-- Tela de login do Banco CTF -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco CTF - Entrar</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="home">
    <header class="navbar">
        <div class="marca">BANCO <span>CTF</span></div>
        <nav class="menu">
            <a href="../index.html">Home</a>
            <a href="login.html" class="ativo">Login</a>
            <a href="cadastro.html">Cadastro</a>
        </nav>
    </header>

    <main class="home-centro com-fundo">
        <div class="acesso">
            <img class="logo" src="../img/logo.svg" alt="Banco CTF">
            <div class="card">
                <h2>Entrar</h2>
                <input id="log_usuario" placeholder="usuario">
                <input id="log_senha" type="password" placeholder="senha">
                <button onclick="logar()">Entrar</button>
                <div id="msg_login" class="msg"></div>
                <div class="links">
                    <a href="cadastro.html">Abrir conta</a> &middot;
                    <a href="recuperar.html">Esqueci minha senha</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="rodape">
        AVISO: projeto educacional. Contem codigo inseguro de proposito.
        NAO use em producao. Uso apenas em localhost.
    </footer>

    <script src="../js/app.js"></script>
</body>
</html>
