<!-- Tela de extrato (movimentacoes da conta) -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco CTF - Extrato</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="app">
    <header class="topbar">
        <button class="hamburguer" onclick="alternarMenu()">&#9776;</button>
        <div class="marca">BANCO <span>CTF</span></div>
        <div class="ola" id="ola"></div>
    </header>

    <div class="overlay-menu" id="overlayMenu" onclick="alternarMenu()"></div>
    <aside class="sidebar" id="sidebar">
        <div class="titulo-menu">MENU</div>
        <a href="saldo.html">Saldo</a>
        <a href="deposito.html">Depositar</a>
        <a href="saque.html">Sacar</a>
        <a href="extrato.html" class="ativo">Extrato</a>
        <a href="perfil.html">Meu usuario</a>
        <a href="admin.html" id="link-admin" class="oculto">Admin</a>
        <a href="#" onclick="logout(); return false;">Sair</a>
    </aside>

    <main class="conteudo">
        <div class="painel">
            <h1>Meu <span>extrato</span></h1>

            <div class="card">
                <h2>Movimentacoes</h2>
                <button onclick="verExtrato()">Atualizar</button>
                <pre id="msg_extrato" class="msg"></pre>
            </div>

            <div class="card">
                <h2>Comprovante</h2>
                <input id="comp_arquivo" value="comprovante-1.txt">
                <button onclick="verComprovante()">Baixar comprovante</button>
                <pre id="msg_comprovante" class="msg"></pre>
            </div>
        </div>
    </main>

    <script src="../js/app.js"></script>
    <script>
        // Carrega o extrato ao abrir a pagina.
        verExtrato();
    </script>
</body>
</html>
