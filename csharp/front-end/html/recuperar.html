<!-- Tela de "esqueci minha senha" -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco CTF - Recuperar senha</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="home">
    <header class="navbar">
        <div class="marca">BANCO <span>CTF</span></div>
        <nav class="menu">
            <a href="../index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="cadastro.html">Cadastro</a>
        </nav>
    </header>

    <main class="home-centro com-fundo">
        <div class="acesso">
            <img class="logo" src="../img/logo.svg" alt="Banco CTF">
            <div class="card">
                <h2>Esqueci minha senha</h2>
                <input id="rec_usuario" placeholder="usuario">
                <input id="rec_cpf" placeholder="cpf">
                <input id="rec_senha" type="password" placeholder="nova senha">
                <button onclick="recuperarSenha()">Trocar senha</button>
                <div id="msg_recuperar" class="msg"></div>
                <div class="links">
                    <a href="login.html">Voltar ao login</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="rodape">
        AVISO: projeto educacional. Contem codigo inseguro de proposito.
        NAO use em producao. Uso apenas em localhost.
    </footer>

    <script src="../js/app.js"></script>
</body>
</html>
